[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# The PyPI face of the cuj crate itself: `pip install cuj`
# ships this crate's binary — the complete CLI — prebuilt,
# under its own name (the quarb-full mechanism, on the base
# name: cuj is more likely wanted as a command than a
# library). The Python library is the sibling distribution
# `libcuj` (import cuj); the two never collide — this wheel
# ships no Python module, that one ships no script.
[project]
name = "cuj"
dynamic = ["version"]
requires-python = ">=3.8"
description = "cuj — n. Clever Use of Jots — a plain-text PKM engine for your terminal, prebuilt: one-line captures, tags and hierarchical categories, todos with due dates, Evernote and Obsidian import, Quarb queries over the vault"
readme = "README-pypi.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Bojan Đuričković" }
]
keywords = ["pkm", "notes", "cli", "journal", "jot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Rust",
    "Environment :: Console",
    "Topic :: Office/Business :: News/Diary",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cuj.net/"
Repository = "https://gitlab.com/cujot/cuj-rs"

[tool.maturin]
bindings = "bin"
strip = true
